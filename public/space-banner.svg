<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#02050e; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c2340" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#050e1f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#02050e" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#034078" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#001833" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes pulseHaze {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes shootStar {
      0% { transform: translateX(0) translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-350px) translateY(180px); opacity: 0; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .star-twinkle-1 { animation: twinkle 3s infinite ease-in-out; }
    .star-twinkle-2 { animation: twinkle 4.5s infinite ease-in-out 1s; }
    .star-twinkle-3 { animation: twinkle 2.2s infinite ease-in-out 0.5s; }
    .star-twinkle-4 { animation: twinkle 3.8s infinite ease-in-out 1.8s; }
    
    .satellite-orbit {
      transform-origin: 940px 210px;
      animation: orbitRotate 20s linear infinite;
    }
    .satellite-orbit-2 {
      transform-origin: 940px 210px;
      animation: orbitCounter 32s linear infinite;
    }
    .satellite-orbit-3 {
      transform-origin: 940px 210px;
      animation: orbitRotate 15s linear infinite;
    }

    .shooting-star-1 {
      animation: shootStar 6s infinite ease-in 2s;
    }
    .shooting-star-2 {
      animation: shootStar 8s infinite ease-in 5s;
    }

    .pulsing-haze { animation: pulseHaze 5s infinite ease-in-out; }
    .floating-header { animation: floatBadge 6s infinite ease-in-out; }
    .radar-line {
      transform-origin: 940px 210px;
      animation: radarScan 8s linear infinite;
    }
  </style>

  <!-- Deep Cosmos Background -->
  <rect width="100%" height="100%" fill="#02050e"/>
  <rect width="100%" height="100%" fill="url(#spaceGlow)"/>

  <!-- Background Starfield (Layered) -->
  <g fill="#ffffff">
    <!-- Starfield group 1 -->
    <circle cx="85" cy="45" r="1.2" class="star-twinkle-1" opacity="0.6"/>
    <circle cx="160" cy="120" r="1" class="star-twinkle-2" opacity="0.5"/>
    <circle cx="240" cy="65" r="1.5" class="star-twinkle-3" opacity="0.8"/>
    <circle cx="310" cy="180" r="1.2" class="star-twinkle-4" opacity="0.7"/>
    <circle cx="420" cy="80" r="1" class="star-twinkle-1" opacity="0.4"/>
    <circle cx="510" cy="220" r="1.4" class="star-twinkle-2" opacity="0.8"/>
    <circle cx="600" cy="50" r="1.8" class="star-twinkle-3" opacity="0.9"/>
    <circle cx="680" cy="160" r="1" class="star-twinkle-4" opacity="0.6"/>
    <circle cx="750" cy="90" r="1.3" class="star-twinkle-1" opacity="0.7"/>
    <circle cx="820" cy="310" r="1.5" class="star-twinkle-2" opacity="0.8"/>
    <circle cx="890" cy="70" r="1" class="star-twinkle-3" opacity="0.5"/>
    <circle cx="1020" cy="40" r="1.6" class="star-twinkle-4" opacity="0.9"/>
    <circle cx="1140" cy="110" r="1.2" class="star-twinkle-1" opacity="0.7"/>
    <circle cx="1100" cy="340" r="1.4" class="star-twinkle-2" opacity="0.8"/>
    <circle cx="70" cy="360" r="1" class="star-twinkle-3" opacity="0.5"/>
    <circle cx="190" cy="280" r="1.5" class="star-twinkle-4" opacity="0.8"/>
    <circle cx="280" cy="350" r="1.2" class="star-twinkle-1" opacity="0.6"/>
    <circle cx="390" cy="290" r="1" class="star-twinkle-2" opacity="0.4"/>
    <circle cx="480" cy="380" r="1.5" class="star-twinkle-3" opacity="0.7"/>
    <circle cx="630" cy="320" r="1.2" class="star-twinkle-4" opacity="0.6"/>
    <!-- Cyan & Gold tinted distant stars -->
    <circle cx="130" cy="210" r="1.8" fill="#38bdf8" class="star-twinkle-1" opacity="0.8"/>
    <circle cx="570" cy="140" r="1.8" fill="#67e8f9" class="star-twinkle-3" opacity="0.9"/>
    <circle cx="720" cy="260" r="2.0" fill="#fde047" class="star-twinkle-2" opacity="0.7"/>
    <circle cx="1060" cy="190" r="1.6" fill="#38bdf8" class="star-twinkle-4" opacity="0.8"/>
  </g>

  <!-- Shooting Stars -->
  <g class="shooting-star-1">
    <line x1="850" y1="30" x2="950" y2="-20" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g class="shooting-star-2">
    <line x1="520" y1="40" x2="620" y2="-10" stroke="url(#textGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Celestial Grid & Hex Reticle -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" fill="none">
    <circle cx="940" cy="210" r="180"/>
    <circle cx="940" cy="210" r="140"/>
    <circle cx="940" cy="210" r="100"/>
    <line x1="740" y1="210" x2="1140" y2="210"/>
    <line x1="940" y1="10" x2="940" y2="410"/>
  </g>

  <!-- 3D Earth & Orbital System -->
  <g transform="translate(0, 0)">
    <!-- Atmospheric Outer Glow -->
    <circle cx="940" cy="210" r="92" fill="url(#earthGlow)" class="pulsing-haze"/>

    <!-- Orbital Track 1 (Inclined Polar Orbit - Sentinel-6 / GRACE-FO) -->
    <g class="satellite-orbit">
      <ellipse cx="940" cy="210" rx="160" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="1.4" stroke-dasharray="4 6" transform="rotate(-35, 940, 210)"/>
      <!-- Satellite Craft A (Sentinel-6) -->
      <g transform="translate(1070, 160) rotate(-35)">
        <polygon points="0,-4 4,0 0,4 -4,0" fill="#38bdf8" filter="url(#neonGlow)"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- Orbital Track 2 (Equatorial / Mid-Inclination - Terra / Aqua) -->
    <g class="satellite-orbit-2">
      <ellipse cx="940" cy="210" rx="175" ry="50" fill="none" stroke="rgba(52, 211, 153, 0.45)" stroke-width="1.2" stroke-dasharray="8 8" transform="rotate(25, 940, 210)"/>
      <!-- Satellite Craft B (GRACE-FO) -->
      <g transform="translate(790, 250) rotate(25)">
        <polygon points="0,-4 4,0 0,4 -4,0" fill="#34d399" filter="url(#neonGlow)"/>
        <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
      </g>
    </g>

    <!-- Orbital Track 3 (Inner Fast Orbit) -->
    <g class="satellite-orbit-3">
      <ellipse cx="940" cy="210" rx="125" ry="40" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" stroke-dasharray="3 5" transform="rotate(-10, 940, 210)"/>
      <circle cx="1045" cy="195" r="2.5" fill="#f59e0b" filter="url(#neonGlow)"/>
    </g>

    <!-- Radar Sweep Line -->
    <line x1="940" y1="210" x2="1080" y2="210" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" class="radar-line"/>

    <!-- Earth Solid Body -->
    <circle cx="940" cy="210" r="76" fill="#03152f" stroke="#38bdf8" stroke-width="1.5" filter="url(#coreGlow)"/>
    
    <!-- Procedural Continents Silhouette (Stylized Cyber Geographic Outlines) -->
    <path d="M 910 160 Q 930 150 945 165 T 970 170 T 960 195 T 940 205 T 915 190 Z" fill="#0284c7" opacity="0.6"/>
    <path d="M 930 215 Q 950 210 965 230 T 960 265 T 935 270 T 925 240 Z" fill="#0369a1" opacity="0.55"/>
    <path d="M 885 185 Q 900 175 910 190 T 900 215 T 880 205 Z" fill="#0284c7" opacity="0.6"/>
    <!-- Polar Ice Caps -->
    <path d="M 920 138 Q 940 135 960 138 Q 950 148 930 148 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M 925 282 Q 940 280 955 282 Q 948 274 932 274 Z" fill="#e0f2fe" opacity="0.85"/>

    <!-- Earth Atmospheric Rim Glow -->
    <circle cx="940" cy="210" r="76" fill="none" stroke="url(#textGrad)" stroke-width="2.2" opacity="0.85"/>
  </g>

  <!-- Left Content: High-Tech Telemetry HUD Typography -->
  <g transform="translate(70, 0)">
    
    <!-- Top Cyber Pill Badge -->
    <g transform="translate(0, 68)" class="floating-header">
      <rect x="0" y="0" width="350" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <polygon points="16,14 20,10 24,14 20,18" fill="#38bdf8"/>
      <text x="32" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">NASA SPACE APPS 2026 • GLOBAL WINNER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5" filter="url(#neonGlow)">
      A E T H E R
    </text>

    <!-- Subtitle -->
    <text x="2" y="194" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">
      Earth System Trend Detective
    </text>

    <!-- Tagline & Description -->
    <text x="2" y="228" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400">
      Interactive 3D Planetary Digital Twin Synthesizing 40 Years of NASA Telemetry
    </text>
    <text x="2" y="248" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">
      GISTEMP v4 • GRACE-FO • Sentinel-6 • OCO-2 • MODIS • Supabase Edge Sync
    </text>

    <!-- Telemetry Cards Row -->
    <g transform="translate(0, 275)">
      <!-- Box 1: Core Engine -->
      <g transform="translate(0, 0)">
        <rect width="180" height="75" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5">FORENSIC ENGINE</text>
        <text x="14" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">60 FPS WebGL</text>
        <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">1980–2026 Scrubber</text>
      </g>

      <!-- Box 2: Mathematical Sieve -->
      <g transform="translate(195, 0)">
        <rect width="180" height="75" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
        <text x="14" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5">MANN-KENDALL TEST</text>
        <text x="14" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">p &lt; 0.001</text>
        <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Signal vs. Noise Proof</text>
      </g>

      <!-- Box 3: Lead & Author -->
      <g transform="translate(390, 0)">
        <rect width="210" height="75" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1"/>
        <text x="14" y="24" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5">LEAD / ARCHITECT</text>
        <text x="14" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Gabriel Martinez Portillo</text>
        <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">MIT License • 2026</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 380)">
      <circle cx="4" cy="-4" r="3.5" fill="#34d399" filter="url(#neonGlow)"/>
      <text x="16" y="0" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
        LIVE IN PRODUCTION: aether-nasa.vercel.app • PUBLIC ACCESS • ZERO LOGIN BARRIER
      </text>
    </g>

  </g>

</svg>
